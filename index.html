<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electronic Prescription System</title>
<style>
  :root {
    --primary-green: #17a26b;      /* প্রিমিয়াম সবুজ */
    --primary-green-dark: #12875a; /* হোভার শেড */
    --secondary-green: #3edc8e;    /* গ্রেডিয়েন্ট লাইট */
    --soft-bg: #f2f6f7;            /* খুব সফট ব্যাকগ্রাউন্ড */
    --card-bg: #ffffff;
    --text-dark: #0a2e1d;
    --text-medium: #385a4d;
    --border-light: #d9e3e8;
    --input-border: #c6d5da;
    --shadow-soft: 0 8px 22px rgba(0, 0, 0, 0.06);
    --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.09);
  }

  body {
    margin: 0;
    font-family: 'Kalpurush', Arial, sans-serif;
    background: #F4F9FF
  }

  /* ---------- HEADER ---------- */
  header {
    background: linear-gradient(110deg, var(--primary-green), var(--secondary-green));
    color: #F4F9FF;
    padding: 22px 26px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 2px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
  }

  header img {
    height: 70px;
    width: 70px;
    border-radius: 14px;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 4px 14px rgba(255, 255, 255, 0.25);
  }

  header .title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.4px;
  }

  /* ---------- MAIN WRAP ---------- */
  .wrap {
    display: flex;
    gap: 24px;
    padding: 22px;
  }

  .left, .right {
    background: #F4F9FF;
    padding: 22px;
    border-radius: 16px;
    box-shadow: var(--shadow-card);
    max-height: 87vh;
    overflow-y: auto;
    border: 1px solid #eef2f4;
  }

  .left { width: 32%; }
  .right { flex: 1; }

  /* ---------- FORM ELEMENTS ---------- */
  h2 {
    margin: 0 0 16px 0;
    color: var(--text-dark);
    font-weight: 800;
  }

  label {
    display: block;
    font-weight: 600;
    margin: 12px 0 6px;
    color: var(--text-medium);
  }

  input, select, textarea {
    width: 100%;
    padding: 12px 13px;
    border: 1px solid var(--input-border);
    border-radius: 12px;
    font-size: 15px;
    background: #fdfefe;
    transition: all 0.25s ease;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--primary-green);
    box-shadow: 0 0 8px rgba(23, 162, 107, 0.35);
    background: #fff;
    outline: none;
  }

  /* ---------- BUTTON ---------- */
  .btn {
    display: inline-block;
    padding: 11px 20px;
    background: var(--primary-green);
    color: #fff;
    border-radius: 12px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 4px 12px rgba(23, 162, 107, 0.3);
  }

  .btn:hover {
    background: var(--primary-green-dark);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(23, 162, 107, 0.35);
  }

  .sec-btn {
    width: 100%;
    text-align: left;
    padding: 12px 16px;
    margin-bottom: 10px;
    border-radius: 12px;
    border: 1px solid #e5ebef;
    background: #fafcfd;
    cursor: pointer;
    font-weight: 600;
    transition: 0.2s;
  }

  .sec-btn:hover {
    background: #e8f6ef;
    border-color: var(--primary-green);
  }

  /* ---------- PRESCRIPTION AREA ---------- */
  #prescriptionOutput {
    min-height: 830px;
    padding: 22px;
    border-radius: 14px;
    background: #d1e8ff;
    border: 1px solid #e1e6e8;
    display: flex;
    gap: 22px;
    box-shadow: var(--shadow-card);
  }

  .preview-left {
    width: 32%;
    border-right: 1px dashed #d1e8ff;
    padding-right: 16px;
  }

  .preview-right {
    flex: 1;
    padding-left: 16px;
  }

  .section-title {
    font-weight: 700;
    margin-top: 12px;
    margin-bottom: 10px;
    color: var(--text-dark);
    font-size: 16px;
  }

  .section-list {
    font-size: 14px;
    color: #333;
    padding-left: 12px;
  }

  /* ---------- MEDICINE TABLE ---------- */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
    border-radius: 10px;
    overflow: hidden;
  }

  th {
    background: var(--primary-green);
    color: #fff;
    padding: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  td {
    border: 1px solid #d7e0e3;
    padding: 10px 8px;
    font-size: 14px;
    background: #fcfdfd;
  }

  /* ---------- SIGNATURE ---------- */
   .footer{
  display: flex;
  justify-content: space-between; /* বামে Next visit, ডানে Signature */
  align-items: flex-end;
  margin-top: 30px;
}

.next-visit{
  font-size: 14px;
}

.sign-box{
  font-size: 14px;
  text-align: center;
}

  /* ---------- MODAL ---------- */
  #modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }

  .modal-card {
    width: 780px;
    background: #fff;
    padding: 26px;
    border-radius: 16px;
    max-height: 86vh;
    overflow: auto;
    box-shadow: var(--shadow-card);
  }

  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .close-btn {
    background: #f1f4f6;
    border: none;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    font-weight: 600;
  }

  .close-btn:hover {
    background: #e1ecee;
  }

  .history-list {
    max-height: 360px;
    overflow: auto;
    border: 1px solid #e3e8eb;
    padding: 12px;
    border-radius: 12px;
    background: #fafbfc;
  }

  /* ---------- Responsive ---------- */
  @media(max-width:900px) {
    .wrap { flex-direction: column; }
    .left { width: 100%; max-height: none; }
    .right { max-height: none; }
    #prescriptionOutput { flex-direction: column; }
    .preview-left {
      width: 100%;
      border-right: none;
      border-bottom: 1px dashed #dfe6e3;
      padding-bottom: 16px;
    }
  }
</style>


</head>

<header>
  <img src="farhad1.jpg" alt="doc">
  <div class="title">Md. Farhad Hossain</div>
  <div style="margin-Left:auto" class="title">Rx software (আপডেট চলছে)</div>

  👤➕ New Patient Add 
</button>

</header>

<div class="wrap">

    <h2>রোগীর তথ্য (Patient)</h2>
    <label>Patient ID</label>
    <input id="pId" />

    <label>নাম</label>
    <input id="pName" placeholder="রোগীর নাম লিখুন" />
    <div class="row">
      <div class="two">
        <label>বয়স</label>
        <input id="pAge" type="number" min="0" />
      </div>
      <div class="two">
        <label>লিঙ্গ</label>
        <select id="pGender"><option value="">নির্বাচন করুন</option><option>Male</option><option>Female</option><option>Others</option></select>
      </div>
    </div>
    <label>ফোন</label>
    <input id="pPhone" />
    <label>ঠিকানা</label>
    <input id="pAddress" />
    <label>তারিখ</label>
    <input id="pDate" type="date" />

   

    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn" onclick="savePrescription()" style="display:flex;align-items:center;gap:6px">
  <svg width="18" height="18" fill="#fff" viewBox="0 0 24 24">
    <path d="M6 2a2 2 0 0 0-2 2v18l8-5.33L20 22V4a2 2 0 0 0-2-2z"/>
  </svg>
  Save to History
</button>

	 
     <button class="btn" style="background:#444" onclick="printPrescription()">🖨️ Print</button>

    </div>

    <h2 style="margin-top:16px">History</h2>
    <div class="small">রোগীর নাম দিয়ে খুঁজুন</div>
    <div style="display:flex;gap:8px;margin:8px 0 12px 0">
      <input id="historySearch" placeholder="রোগীর নাম" />
      <button class="btn" onclick="searchHistory()">Search</button>
    </div>
    <div class="history-list" id="historyList"></div>

  </div>

  <div class="right">
    <h2>Prescription Preview</h2>
    <div id="prescriptionOutput">
      <div class="preview-left">
        <!-- Sections list will render here -->
      </div>
      <div class="preview-right">
        <!-- Medicines and main body will render here -->
      </div>
    </div>
  </div>
</div>

<!-- modal -->
<div id="modal"><div class="modal-card">
  <div class="modal-head">
    <h3 id="modalTitle">Section</h3>
    <div class="actions">
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>
  <div id="modalBody" style="margin-top:12px"></div>
  <div style="margin-top:12px;text-align:right">
    <button class="btn" id="modalSaveBtn">Save</button>
  </div>
</div></div>

// Utility: render prescription (updated)
function arrToStr(a){
  if(!Array.isArray(a)) return '-';
  
  // Filter out empty strings or ×
  const clean = a
    .map(v => (v ?? '').toString().trim()) // null বা undefined handle
    .filter(v => v !== '' && v !== '×');  // খালি বা × remove

  if(!clean.length) return '-';

  return '<ul style="margin:4px 0 4px 16px;padding:0">' +
    clean.map(v => `<li>${v}</li>`).join('') +
  '</ul>';
}

function savePrescription(){
  if(!patientInfo.name){ alert('প্রথমে Patient Info পূরণ করুন'); return; }
  const obj = { patient:patientInfo, prescription: JSON.parse(JSON.stringify(prescriptionData)), timestamp:new Date().toISOString() };
  const hist = JSON.parse(localStorage.getItem('prescriptionHistory')||'[]');
  hist.unshift(obj);
  localStorage.setItem('prescriptionHistory', JSON.stringify(hist));
  alert('Saved to History');
  renderHistory();
}

function renderHistory(list){
  const hist = list || JSON.parse(localStorage.getItem('prescriptionHistory')||'[]');

    const d = new Date(it.timestamp).toLocaleString('bn-BD');
    const div = document.createElement('div'); div.style.padding='8px'; div.style.borderBottom='1px solid #eef3f6';
    div.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><div><strong>${escapeHtml(it.patient.name||'-')}</strong><div class="small">Age: ${escapeHtml(it.patient.age||'-')} | ${d}</div></div><div style="display:flex;gap:6px"><button class='btn' onclick='viewHistory(${idx})'>View</button><button style="background:#c33;color:#fff;border:none;padding:6px 8px;border-radius:6px" onclick='deleteHistory(${idx})'>Delete</button></div></div>`;
    el.appendChild(div);

			function searchHistory(){
  const input = document.getElementById('historySearch');
  const q = input.value.trim().toLowerCase();

  const hist = JSON.parse(localStorage.getItem('prescriptionHistory') || '[]');

  // 🔴 যদি সার্চ বক্স খালি থাকে → সব দেখাবে
  if(q === ''){
    renderHistory(hist);
    return;
  }

  const filtered = hist.filter(it => {
    const name = (it.patient?.name || '').toString().toLowerCase();
    return name.includes(q);
  });

  renderHistory(filtered);
}

<script>
// ===== License Lock System =====
const allowedUser = "f";
const allowedKey  = "f";

function checkLogin(){
  const user = document.getElementById("username").value.trim().toLowerCase();
  const pass = document.getElementById("password").value.trim();
  const error = document.getElementById("loginError");

  if(!user || !pass){
    error.innerText = "ইউজার নাম ও পাসওয়ার্ড দিন";
    return;
  }

  if(user !== allowedUser || pass !== allowedKey){
    error.innerHTML =
      "ইউজার নাম বা পাসওয়ার্ড ভুল।<br>যোগাযোগ করুনঃ ০১৩২৫৮৮৮৩০১";
    return;
  }

  // ✅ Login Success
  document.getElementById("loginOverlay").style.display = "none";
}

// ❌ Cancel = Page Close
function cancelLogin(){
  window.open('', '_self');
  window.close();

  // Fallback (browser block করলে)
  document.body.innerHTML = "";
}
</script>
